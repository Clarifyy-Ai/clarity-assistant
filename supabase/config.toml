# JWT verification at the Supabase gateway (defense in depth).
# Public/webhook endpoints must set verify_jwt = false explicitly.
# All other functions default to verify_jwt = true below.

[functions.ping]
verify_jwt = false

# Public liveness alias for ping (minimal { status: "ok" } only).
[functions.health]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

# Razorpay webhooks are signed by HMAC — must NOT verify Supabase JWT.
[functions.razorpay-webhook]
verify_jwt = false

