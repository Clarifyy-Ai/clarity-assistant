<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Clarify AI">
  <defs>
    <linearGradient id="face" x1="12%" y1="8%" x2="90%" y2="95%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="45%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="side" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- isometric crystal C mark -->
  <g filter="url(#soft)">
    <!-- right facet -->
    <path fill="url(#side)" d="M38 14 L50 20 L50 44 L38 50 Z"/>
    <!-- front facet -->
    <path fill="url(#face)" d="M14 20 L38 14 L38 50 L14 44 Z"/>
    <!-- top facet -->
    <path fill="url(#top)" opacity="0.9" d="M14 20 L26 14 L50 20 L38 14 Z"/>
    <!-- inner cut (C opening) -->
    <path fill="#0b1220" opacity="0.55" d="M24 26 L34 23 L34 41 L24 38 Z"/>
    <!-- specular -->
    <path fill="#ffffff" opacity="0.35" d="M18 22 L28 18 L30 22 L20 26 Z"/>
  </g>
</svg>
