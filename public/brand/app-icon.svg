<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Clarify Coach">
  <defs>
    <linearGradient id="tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#22d3ee" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="url(#ring)" stroke-width="4" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.35"/>
  <text x="32" y="40" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="26" font-weight="800" fill="#f8fafc">C</text>
  <circle cx="42" cy="42" r="3.2" fill="#2dd4bf"/>
</svg>
