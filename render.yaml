# Render Blueprint for Clarity.AI Python scraper + paper factory
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: clarity-scraper
    runtime: docker
    plan: starter
    region: ohio
    rootDir: scraper
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PAPER_FACTORY_EMBEDDED_WORKER
        value: "true"
      - key: DOCUMENT_WORKER_EMBEDDED
        value: "true"
      - key: SCRAPE_DAILY_ENABLED
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: DOCUMENT_INTELLIGENCE_AUTH_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SYSTEM_USER_ID
        sync: false
      - key: SYSTEM_USER_EMAIL
        sync: false
      - key: CORS_ORIGINS
        sync: false
        # Set in Render Dashboard → clarity-scraper → Environment (dashboard overrides this blueprint).
        # Recommended production value:
        # https://trycareerpilot.com,https://www.trycareerpilot.com,https://clarify.ai.sltfinanceindia.com
