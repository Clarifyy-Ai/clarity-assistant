<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Browser compatibility -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Responsive viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Security Policy:
      This CSP is intentionally compatible with Vite + React + inline JSON-LD + theme bootstrap script.
      For stronger production security, move inline scripts to external files or use nonce-based CSP at CDN/server level.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        base-uri 'self';
        object-src 'none';
        script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: https:;
        font-src 'self' data:;
        connect-src 'self'
          https://*.supabase.co
          wss://*.supabase.co
          https://api.openai.com
          https://api.anthropic.com
          https://generativelanguage.googleapis.com
          https://api.deepgram.com
          wss://api.deepgram.com
          https://*.sentry.io
          https://*.ingest.sentry.io
          https://app.posthog.com
          https://us.i.posthog.com
          https://eu.i.posthog.com;
        media-src 'self' blob: data:;
        worker-src 'self' blob:;
        manifest-src 'self';
        form-action 'self';
        upgrade-insecure-requests;
      "
    />

    <!-- Referrer protection -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Permissions policy fallback for supporting browsers -->
    <meta
      http-equiv="Permissions-Policy"
      content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)"
    />

    <title>Clarify AI — AI-Powered Interview Preparation</title>

    <meta
      name="description"
      content="Live AI practice coaching for mock and rehearsal sessions. Multi-model routing across Gemini, GPT-4o, and Claude. Mock interviews, prep lab, and analytics. Start free with 50 credits/month."
    />

    <link rel="canonical" href="https://clarify.ai.sltfinanceindia.com/" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#09090b" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="Clarify AI — AI-Powered Interview Preparation" />
    <meta
      property="og:description"
      content="Live AI practice coaching for mock and rehearsal sessions. Multi-model routing across Gemini, GPT-4o, and Claude."
    />
    <meta property="og:url" content="https://clarify.ai.sltfinanceindia.com/" />
    <meta property="og:site_name" content="Clarify AI" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://clarify.ai.sltfinanceindia.com/images/og-cover.png" />

    <!-- Twitter -->
    <meta name="twitter:title" content="Clarify AI — AI-Powered Interview Preparation" />
    <meta
      name="twitter:description"
      content="Live AI practice coaching for mock and rehearsal sessions. Multi-model routing across Gemini, GPT-4o, and Claude."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://clarify.ai.sltfinanceindia.com/images/og-cover.png" />

    <!-- Brand JSON-LD: WebSite + Organization for rich search results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "Clarify AI",
            "url": "https://clarify.ai.sltfinanceindia.com/",
            "logo": "https://clarify.ai.sltfinanceindia.com/icon.png",
            "sameAs": [
              "https://twitter.com/clarifyai",
              "https://github.com/clarifyai"
            ]
          },
          {
            "@type": "WebSite",
            "name": "Clarify AI",
            "url": "https://clarify.ai.sltfinanceindia.com/",
            "description": "AI-powered interview preparation with live practice coaching, mock sessions, prep lab, and multi-model AI routing."
          }
        ]
      }
    </script>
  </head>

  <body>
    <!--
      Pre-hydration theme script:
      Keeps theme consistent before React renders.
      SECURITY NOTE:
      This inline script requires 'unsafe-inline' in the current CSP.
      Future hardening option: move this script to /theme-init.js or use nonce-based CSP from server/CDN.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("confideq-ui");
          var isDark = false;

          if (stored) {
            var state = JSON.parse(stored);
            var resolved = state.state && state.state.resolved_theme;
            var theme = state.state && state.state.theme;

            isDark =
              theme === "dark" ||
              (theme === "system" && resolved === "dark");
          }

          document.documentElement.classList.toggle("dark", isDark);
        } catch (e) {
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>

    <!-- React app root -->
    <div id="root"></div>

    <!--
      Overlay portal root:
      Intentionally outside #root so overlay UI is not clipped by React root stacking context.

      SECURITY NOTE:
      Keep this element inert by default with pointer-events:none.
      Only trusted overlay components should enable pointer-events:auto on child panels.
    -->
    <div
      id="overlay-root"
      style="position:fixed;inset:0;pointer-events:none;z-index:1100;isolation:isolate;"
    ></div>

    <!--
      Practice overlay portal root (OverlayWindow mounts here).
      Kept separate from #overlay-root for layout isolation.

      SECURITY NOTE:
      Do not inject unsanitized user-generated HTML into this root.
      All dynamic content rendered into this portal must be React-escaped or DOMPurify-sanitized.
    -->
    <div
      id="clarify-overlay-root"
      style="position:fixed;inset:0;pointer-events:none;z-index:1100;isolation:isolate;"
    ></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
