<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Browser compatibility -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Responsive viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Security Policy:
      script-src: no 'unsafe-inline' — Vite prod injects module scripts only;
      theme + JSON-LD live in /theme-init.js and /structured-data.js.
      style-src keeps 'unsafe-inline' for Tailwind runtime + boot-splash
      inline style attributes (nonce/hash CSP can remove this later at CDN).
      Electron CSP is tightened separately in electron/main.cjs — do not weaken it.
      connect-src is intentionally allowlisted to known backends only.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        base-uri 'self';
        object-src 'none';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: https:;
        font-src 'self' data: https://cdn.gpteng.co;
        connect-src 'self'
          https://api.github.com
          https://*.supabase.co
          wss://*.supabase.co
          https://api.openai.com
          https://api.anthropic.com
          https://generativelanguage.googleapis.com
          https://api.deepgram.com
          wss://api.deepgram.com
          https://*.sentry.io
          https://*.ingest.sentry.io
          https://app.posthog.com
          https://us.i.posthog.com
          https://eu.i.posthog.com;
        media-src 'self' blob: data:;
        worker-src 'self' blob:;
        manifest-src 'self';
        form-action 'self';
      "
    />

    <!-- Referrer protection -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Permissions policy fallback for supporting browsers -->
    <meta
      http-equiv="Permissions-Policy"
      content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)"
    />

    <title>Clarify AI — AI-Powered Interview Preparation</title>

    <meta
      name="description"
      content="Live AI practice coaching for mock and rehearsal sessions. Multi-model routing across Gemini, GPT-4o, and Claude. Mock interviews, prep lab, and analytics. Start free with 50 credits/month."
    />

    <link rel="canonical" href="https://clarify.ai.sltfinanceindia.com/" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#09090b" />

    <!-- Icons: root-absolute so nested SPA routes do not 404 /app/.../favicon.* -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/brand/app-icon-192.png" />
    <meta name="application-name" content="Clarify Coach" />
    <meta name="apple-mobile-web-app-title" content="Clarify Coach" />

    <!-- Open Graph -->
    <meta property="og:title" content="Clarify AI — AI-Powered Interview Preparation" />
    <meta
      property="og:description"
      content="Live AI practice coaching for mock and rehearsal sessions. Multi-model routing across Gemini, GPT-4o, and Claude."
    />
    <meta property="og:url" content="https://clarify.ai.sltfinanceindia.com/" />
    <meta property="og:site_name" content="Clarify AI" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://clarify.ai.sltfinanceindia.com/images/og-cover.png" />

    <!-- Twitter -->
    <meta name="twitter:title" content="Clarify AI — AI-Powered Interview Preparation" />
    <meta
      name="twitter:description"
      content="Live AI practice coaching for mock and rehearsal sessions. Multi-model routing across Gemini, GPT-4o, and Claude."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://clarify.ai.sltfinanceindia.com/images/og-cover.png" />

    <!--
      Structured data (JSON-LD) — static data block; not an executable script.
      Embedding directly avoids the CSP violation triggered by structured-data.js
      which used document.createElement("script") at runtime.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "Clarify AI",
          "url": "https://clarify.ai.sltfinanceindia.com/",
          "logo": "https://clarify.ai.sltfinanceindia.com/icon.png",
          "sameAs": [
            "https://twitter.com/clarifyai",
            "https://github.com/clarifyai"
          ]
        },
        {
          "@type": "WebSite",
          "name": "Clarify AI",
          "url": "https://clarify.ai.sltfinanceindia.com/",
          "description": "AI-powered interview preparation with live practice coaching, mock sessions, prep lab, and multi-model AI routing."
        }
      ]
    }
    </script>
    <script src="./theme-init.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </head>

  <body>

    <!-- React app root — boot splash shows instantly before JS bundle loads -->
    <div id="root">
      <div
        id="boot-splash"
        role="status"
        aria-live="polite"
        aria-busy="true"
        style="
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          background: #0f172a;
          color: #e2e8f0;
          font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        "
      >
        <div
          style="
            width: 40px;
            height: 40px;
            border: 3px solid rgba(148, 163, 184, 0.25);
            border-top-color: #8b5cf6;
            border-radius: 9999px;
            animation: clarify-boot-spin 0.8s linear infinite;
          "
        ></div>
        <p style="margin: 0; font-size: 14px; font-weight: 600;">Loading Clarify AI…</p>
        <p style="margin: 0; font-size: 12px; opacity: 0.65;">Preparing your workspace</p>
      </div>
    </div>
    <style>
      @keyframes clarify-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <!-- Boot watchdog: if React never mounts, surface the real error + retry -->
    <script src="/boot-watchdog.js"></script>


    <!--
      Overlay portal root:
      Intentionally outside #root so overlay UI is not clipped by React root stacking context.

      SECURITY NOTE:
      Keep this element inert by default with pointer-events:none.
      Only trusted overlay components should enable pointer-events:auto on child panels.
    -->
    <div
      id="overlay-root"
      style="position:fixed;inset:0;pointer-events:none;z-index:1100;isolation:isolate;"
    ></div>

    <!--
      Practice overlay portal root (OverlayWindow mounts here).
      Kept separate from #overlay-root for layout isolation.

      SECURITY NOTE:
      Do not inject unsanitized user-generated HTML into this root.
      All dynamic content rendered into this portal must be React-escaped or DOMPurify-sanitized.
    -->
    <div
      id="clarify-overlay-root"
      style="position:fixed;inset:0;pointer-events:none;z-index:1100;isolation:isolate;"
    ></div>


  </body>
</html>
