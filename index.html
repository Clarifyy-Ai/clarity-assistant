<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Browser compatibility -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Responsive viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Security Policy:
      script-src: no 'unsafe-inline' — Vite prod injects module scripts only;
      theme lives in /theme-init.js; JSON-LD is static in this document
      (#clarify-page-jsonld for page-level updates — never createElement('script')).
      style-src keeps 'unsafe-inline' for Tailwind runtime + boot-splash
      inline style attributes (nonce/hash CSP can remove this later at CDN).
      Electron CSP is tightened separately in electron/main.cjs — do not weaken it.
      connect-src is intentionally allowlisted to known backends only.
      font-src allows self-hosted @fontsource assets plus Lovable widget font CDN.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        base-uri 'self';
        object-src 'none';
        script-src 'self' 'sha256-94vmev1ZHn894g2iVWfQ1aQu9FkC2BtPA7fJnXbTA7Y=' https://checkout.razorpay.com https://cdn.razorpay.com https://*.razorpay.com https://www.googletagmanager.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://www.google.com;
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: https:;
        font-src 'self' data: https://cdn.gpteng.co;
        connect-src 'self'
          https://api.github.com
          https://*.supabase.co
          wss://*.supabase.co
          https://api.openai.com
          https://api.anthropic.com
          https://generativelanguage.googleapis.com
          https://api.deepgram.com
          wss://api.deepgram.com
          https://*.sentry.io
          https://*.ingest.sentry.io
          https://app.posthog.com
          https://us.i.posthog.com
          https://eu.i.posthog.com
          https://api.razorpay.com
          https://lumberjack.razorpay.com
          https://checkout.razorpay.com
          https://cdn.razorpay.com
          https://*.razorpay.com
          https://www.googletagmanager.com
          https://www.google-analytics.com
          https://www.google.com
          https://googleads.g.doubleclick.net
          https://www.googleadservices.com
          https://stats.g.doubleclick.net;
        frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com https://cdn.razorpay.com https://*.razorpay.com https://checkout.stripe.com https://www.google.com https://googleads.g.doubleclick.net https://www.googletagmanager.com https://td.doubleclick.net;
        media-src 'self' blob: data:;
        worker-src 'self' blob:;
        manifest-src 'self';
        form-action 'self' https://checkout.razorpay.com https://checkout.stripe.com;
      "
    />

    <!-- Referrer protection -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Permissions policy fallback for supporting browsers -->
    <meta
      http-equiv="Permissions-Policy"
      content="camera=(), microphone=(self), geolocation=(), payment=(self), usb=(), fullscreen=(self)"
    />

    <title>Career Pilot — AI Career & Exam Preparation</title>

    <meta
      name="description"
      content="AI-powered interview prep and government exam practice for India. Mock interviews, Practice Coach, UPSC, SSC CGL, IBPS, JEE, NEET — timed papers, STAR answers, and performance insights."
    />
    <meta
      name="keywords"
      content="Career Pilot, AI interview preparation, mock interview practice India, UPSC CSE mock test, SSC CGL mock test, IBPS PO mock test, JEE Main practice test, NEET UG mock test, AI interview coach, STAR method interview answers, government exam preparation"
    />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="bingbot" content="index, follow" />
    <meta name="author" content="Career Pilot" />
    <meta name="geo.region" content="IN" />
    <link rel="alternate" hrefLang="en-IN" href="https://trycareerpilot.com/" />
    <link rel="alternate" hrefLang="x-default" href="https://trycareerpilot.com/" />

    <link rel="canonical" href="https://trycareerpilot.com/" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#0B1220" />

    <!-- Icons: root-absolute so nested SPA routes do not 404 /app/.../favicon.* -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/brand/app-icon-192.png" />
    <meta name="application-name" content="Career Pilot" />
    <meta name="apple-mobile-web-app-title" content="Career Pilot" />

    <!-- Open Graph -->
    <meta property="og:title" content="Career Pilot — AI Career & Exam Preparation" />
    <meta
      property="og:description"
      content="Navigate Your Career. Prepare With Confidence. AI-powered career and exam preparation."
    />
    <meta property="og:url" content="https://trycareerpilot.com/" />
    <meta property="og:site_name" content="Career Pilot" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://trycareerpilot.com/images/og-cover.png" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:title" content="Career Pilot — AI Career & Exam Preparation" />
    <meta
      name="twitter:description"
      content="Navigate Your Career. Prepare With Confidence. AI-powered career and exam preparation."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://trycareerpilot.com/images/og-cover.png" />

    <!--
      Structured data (JSON-LD) — static data block; not an executable script.
      Embedding directly avoids the CSP violation triggered by structured-data.js
      which used document.createElement("script") at runtime.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "Career Pilot",
          "url": "https://trycareerpilot.com/",
          "logo": "https://trycareerpilot.com/icon.png",
          "sameAs": [
            "https://github.com/Clarifyy-Ai"
          ],
          "areaServed": "IN"
        },
        {
          "@type": "WebSite",
          "name": "Career Pilot",
          "url": "https://trycareerpilot.com/",
          "description": "AI-Powered Career & Exam Preparation",
          "inLanguage": "en-IN"
        }
      ]
    }
    </script>
    <!--
      Page-level JSON-LD slot. usePageMeta updates textContent on this existing
      element — never createElement('script'), which CSP treats as inline JS.
    -->
    <script type="application/ld+json" id="clarify-page-jsonld">{}</script>
    <script src="/theme-init.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </head>

  <body>

    <!-- React app root — boot splash shows instantly before JS bundle loads -->
    <div id="root">
      <div
        id="boot-splash"
        role="status"
        aria-live="polite"
        aria-busy="true"
        style="
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          background: #0B1220;
          color: #F5F7FA;
          font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        "
      >
        <div
          style="
            width: 40px;
            height: 40px;
            border: 3px solid rgba(148, 163, 184, 0.25);
            border-top-color: #38BDF8;
            border-radius: 9999px;
            animation: clarify-boot-spin 0.8s linear infinite;
          "
        ></div>
        <p style="margin: 0; font-size: 14px; font-weight: 600;">Loading Career Pilot…</p>
        <p style="margin: 0; font-size: 12px; opacity: 0.65;">Preparing your workspace</p>
      </div>
    </div>
    <style>
      @keyframes clarify-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <!-- Boot watchdog: if React never mounts, surface the real error + retry -->
    <script src="/boot-watchdog.js"></script>


    <!--
      Overlay portal root:
      Intentionally outside #root so overlay UI is not clipped by React root stacking context.

      SECURITY NOTE:
      Keep this element inert by default with pointer-events:none.
      Only trusted overlay components should enable pointer-events:auto on child panels.
    -->
    <div
      id="overlay-root"
      style="position:fixed;inset:0;pointer-events:none;z-index:1100;isolation:isolate;"
    ></div>

    <!--
      Practice overlay portal root (OverlayWindow mounts here).
      Kept separate from #overlay-root for layout isolation.

      SECURITY NOTE:
      Do not inject unsanitized user-generated HTML into this root.
      All dynamic content rendered into this portal must be React-escaped or DOMPurify-sanitized.
    -->
    <div
      id="clarify-overlay-root"
      style="position:fixed;inset:0;pointer-events:none;z-index:1100;isolation:isolate;"
    ></div>


  </body>
</html>
