<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Browser compatibility -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Responsive viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Security Policy:
      script-src: no 'unsafe-inline' — Vite prod injects module scripts only;
      theme + JSON-LD live in /theme-init.js and /structured-data.js.
      style-src keeps 'unsafe-inline' for Tailwind runtime + boot-splash
      inline style attributes (nonce/hash CSP can remove this later at CDN).
      Electron CSP is tightened separately in electron/main.cjs — do not weaken it.
      connect-src is intentionally allowlisted to known backends only.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        base-uri 'self';
        object-src 'none';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: https:;
        font-src 'self' data:;
        connect-src 'self'
          https://api.github.com
          https://*.supabase.co
          wss://*.supabase.co
          https://api.openai.com
          https://api.anthropic.com
          https://generativelanguage.googleapis.com
          https://api.deepgram.com
          wss://api.deepgram.com
          https://*.sentry.io
          https://*.ingest.sentry.io
          https://app.posthog.com
          https://us.i.posthog.com
          https://eu.i.posthog.com;
        media-src 'self' blob: data:;
        worker-src 'self' blob:;
        manifest-src 'self';
        form-action 'self';
      "
    />

    <!-- Referrer protection -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Permissions policy fallback for supporting browsers -->
    <meta
      http-equiv="Permissions-Policy"
      content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)"
    />

    <title>Clarify AI — AI-Powered Interview Preparation</title>

    <meta
      name="description"
      content="Live AI practice coaching for mock and rehearsal sessions. Multi-model routing across Gemini, GPT-4o, and Claude. Mock interviews, prep lab, and analytics. Start free with 50 credits/month."
    />

    <link rel="canonical" href="https://clarify.ai.sltfinanceindia.com/" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#09090b" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icon.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="Clarify AI — AI-Powered Interview Preparation" />
    <meta
      property="og:description"
      content="Live AI practice coaching for mock and rehearsal sessions. Multi-model routing across Gemini, GPT-4o, and Claude."
    />
    <meta property="og:url" content="https://clarify.ai.sltfinanceindia.com/" />
    <meta property="og:site_name" content="Clarify AI" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://clarify.ai.sltfinanceindia.com/images/og-cover.png" />

    <!-- Twitter -->
    <meta name="twitter:title" content="Clarify AI — AI-Powered Interview Preparation" />
    <meta
      name="twitter:description"
      content="Live AI practice coaching for mock and rehearsal sessions. Multi-model routing across Gemini, GPT-4o, and Claude."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://clarify.ai.sltfinanceindia.com/images/og-cover.png" />

    <script src="./structured-data.js"></script>
    <script src="./theme-init.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </head>

  <body>

    <!-- React app root — boot splash shows instantly before JS bundle loads -->
    <div id="root">
      <div
        id="boot-splash"
        role="status"
        aria-live="polite"
        aria-busy="true"
        style="
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          background: #0f172a;
          color: #e2e8f0;
          font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        "
      >
        <div
          style="
            width: 40px;
            height: 40px;
            border: 3px solid rgba(148, 163, 184, 0.25);
            border-top-color: #8b5cf6;
            border-radius: 9999px;
            animation: clarify-boot-spin 0.8s linear infinite;
          "
        ></div>
        <p style="margin: 0; font-size: 14px; font-weight: 600;">Loading Clarify AI…</p>
        <p style="margin: 0; font-size: 12px; opacity: 0.65;">Preparing your workspace</p>
      </div>
    </div>
    <style>
      @keyframes clarify-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <!-- Boot watchdog: if React never mounts, surface the real error + retry -->
    <script>
      (function () {
        var BOOT_TIMEOUT_MS = 8000;
        var firstError = null;
        function onErr(e) {
          if (!firstError) {
            firstError = (e && (e.message || (e.reason && e.reason.message) || e.reason)) || "Unknown error";
          }
        }
        window.addEventListener("error", onErr);
        window.addEventListener("unhandledrejection", onErr);

        setTimeout(function () {
          var splash = document.getElementById("boot-splash");
          if (!splash || !splash.isConnected) return; // React mounted, splash replaced
          splash.innerHTML =
            '<div style="max-width:32rem;text-align:center;display:flex;flex-direction:column;gap:12px;padding:0 24px">' +
            '<p style="margin:0;font-size:18px;font-weight:700">The app didn\'t finish loading</p>' +
            '<p style="margin:0;font-size:13px;opacity:.7;line-height:1.6">This is usually a stale cached bundle in the preview. Retry below, or hard-refresh with Ctrl/Cmd + Shift + R.</p>' +
            (firstError
              ? '<pre style="margin:0;white-space:pre-wrap;text-align:left;font-size:11px;background:rgba(148,163,184,.12);padding:10px;border-radius:8px;overflow:auto;max-height:160px">' +
                String(firstError).replace(/[<>&]/g, function (c) { return { "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]; }) +
                "</pre>"
              : "") +
            '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">' +
            '<button id="boot-retry" style="cursor:pointer;border:0;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;background:#8b5cf6;color:#fff">Retry</button>' +
            '<a href="https://developer.chrome.com/docs/devtools/open" target="_blank" rel="noopener noreferrer" style="border:1px solid rgba(148,163,184,.35);border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;color:#e2e8f0;text-decoration:none">How to open DevTools</a>' +
            "</div></div>";
          splash.removeAttribute("aria-busy");
          var btn = document.getElementById("boot-retry");
          if (btn) {
            btn.addEventListener("click", function () {
              if ("serviceWorker" in navigator) {
                navigator.serviceWorker.getRegistrations().then(function (rs) {
                  rs.forEach(function (r) { r.unregister(); });
                }).catch(function () {});
              }
              if (window.caches) {
                caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); }).catch(function () {});
              }
              setTimeout(function () { window.location.reload(); }, 150);
            });
          }
        }, BOOT_TIMEOUT_MS);
      })();
    </script>


    <!--
      Overlay portal root:
      Intentionally outside #root so overlay UI is not clipped by React root stacking context.

      SECURITY NOTE:
      Keep this element inert by default with pointer-events:none.
      Only trusted overlay components should enable pointer-events:auto on child panels.
    -->
    <div
      id="overlay-root"
      style="position:fixed;inset:0;pointer-events:none;z-index:1100;isolation:isolate;"
    ></div>

    <!--
      Practice overlay portal root (OverlayWindow mounts here).
      Kept separate from #overlay-root for layout isolation.

      SECURITY NOTE:
      Do not inject unsanitized user-generated HTML into this root.
      All dynamic content rendered into this portal must be React-escaped or DOMPurify-sanitized.
    -->
    <div
      id="clarify-overlay-root"
      style="position:fixed;inset:0;pointer-events:none;z-index:1100;isolation:isolate;"
    ></div>


  </body>
</html>
