<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Browser compatibility -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Responsive viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      Security Policy:
      script-src: no 'unsafe-inline' — Vite prod injects module scripts only;
      theme lives in /theme-init.js; JSON-LD is static in this document
      (#clarify-page-jsonld for page-level updates — never createElement('script')).
      style-src keeps 'unsafe-inline' for Tailwind runtime + boot-splash
      inline style attributes (nonce/hash CSP can remove this later at CDN).
      Electron CSP is tightened separately in electron/main.cjs — do not weaken it.
      connect-src is intentionally allowlisted to known backends only.
      font-src allows self-hosted @fontsource assets plus Lovable widget font CDN.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        base-uri 'self';
        object-src 'none';
        script-src 'self' 'sha256-94vmev1ZHn894g2iVWfQ1aQu9FkC2BtPA7fJnXbTA7Y=' https://checkout.razorpay.com https://cdn.razorpay.com https://*.razorpay.com https://www.googletagmanager.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://www.google.com;
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: https:;
        font-src 'self' data: https://cdn.gpteng.co;
        connect-src 'self'
          https://api.github.com
          https://*.supabase.co
          wss://*.supabase.co
          https://api.openai.com
          https://api.anthropic.com
          https://generativelanguage.googleapis.com
          https://api.deepgram.com
          wss://api.deepgram.com
          https://agent.deepgram.com
          wss://agent.deepgram.com
          https://*.sentry.io
          https://*.ingest.sentry.io
          https://app.posthog.com
          https://us.i.posthog.com
          https://eu.i.posthog.com
          https://api.razorpay.com
          https://lumberjack.razorpay.com
          https://checkout.razorpay.com
          https://cdn.razorpay.com
          https://*.razorpay.com
          https://www.googletagmanager.com
          https://www.google-analytics.com
          https://www.google.com
          https://googleads.g.doubleclick.net
          https://www.googleadservices.com
          https://stats.g.doubleclick.net
          https://clarity-assistant-az05.onrender.com
          https://*.onrender.com;
        frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com https://cdn.razorpay.com https://*.razorpay.com https://checkout.stripe.com https://www.google.com https://googleads.g.doubleclick.net https://www.googletagmanager.com https://td.doubleclick.net;
        media-src 'self' blob: data:;
        worker-src 'self' blob:;
        manifest-src 'self';
        form-action 'self' https://checkout.razorpay.com https://checkout.stripe.com;
      "
    />

    <!-- Referrer protection -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Permissions policy fallback for supporting browsers -->
    <meta
      http-equiv="Permissions-Policy"
      content="camera=(), microphone=(self), geolocation=(), payment=(self), usb=(), fullscreen=(self)"
    />

    <title>Career Pilot — AI Career & Exam Preparation</title>

    <meta
      name="description"
      content="AI-powered interview prep and government exam practice for India. Mock interviews, Practice Coach, UPSC, SSC CGL, IBPS, JEE, NEET — timed papers, STAR answers, and performance insights."
    />
    <meta
      name="keywords"
      content="Career Pilot, AI interview preparation, mock interview practice India, UPSC CSE mock test, SSC CGL mock test, IBPS PO mock test, JEE Main practice test, NEET UG mock test, AI interview coach, STAR method interview answers, government exam preparation"
    />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="bingbot" content="index, follow" />
    <meta name="author" content="Career Pilot" />
    <meta name="geo.region" content="IN" />
    <link rel="alternate" hrefLang="en-IN" href="https://trycareerpilot.com/" />
    <link rel="alternate" hrefLang="x-default" href="https://trycareerpilot.com/" />

    <link rel="canonical" href="https://trycareerpilot.com/" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#0B1220" />

    <!-- Icons: root-absolute so nested SPA routes do not 404 /app/.../favicon.* -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/brand/app-icon-192.png" />
    <meta name="application-name" content="Career Pilot" />
    <meta name="apple-mobile-web-app-title" content="Career Pilot" />

    <!-- Open Graph -->
    <meta property="og:title" content="Career Pilot — AI Career & Exam Preparation" />
    <meta
      property="og:description"
      content="Navigate Your Career. Prepare With Confidence. AI-powered career and exam preparation."
    />
    <meta property="og:url" content="https://trycareerpilot.com/" />
    <meta property="og:site_name" content="Career Pilot" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://trycareerpilot.com/images/og-cover.png" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:title" content="Career Pilot — AI Career & Exam Preparation" />
    <meta
      name="twitter:description"
      content="Navigate Your Career. Prepare With Confidence. AI-powered career and exam preparation."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://trycareerpilot.com/images/og-cover.png" />

    <!--
      Structured data (JSON-LD) — static data block; not an executable script.
      Embedding directly avoids the CSP violation triggered by structured-data.js
      which used document.createElement("script") at runtime.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "Career Pilot",
          "url": "https://trycareerpilot.com/",
          "logo": "https://trycareerpilot.com/icon.png",
          "sameAs": [
            "https://github.com/Clarifyy-Ai"
          ],
          "areaServed": "IN"
        },
        {
          "@type": "WebSite",
          "name": "Career Pilot",
          "url": "https://trycareerpilot.com/",
          "description": "AI-Powered Career & Exam Preparation",
          "inLanguage": "en-IN"
        }
      ]
    }
    </script>
    <!--
      Page-level JSON-LD slot. usePageMeta updates textContent on this existing
      element — never createElement('script'), which CSP treats as inline JS.
    -->
    <script type="application/ld+json" id="clarify-page-jsonld">{}</script>
    <script src="/theme-init.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </head>

  <body>

    <!-- React app root — boot splash shows instantly before JS bundle loads -->
    <div id="root">
      <div
        id="boot-splash"
        class="boot-splash"
        role="status"
        aria-live="polite"
        aria-busy="true"
      >
        <div class="boot-splash-ambient" aria-hidden="true">
          <div class="boot-splash-glow"></div>
          <div class="boot-splash-grid"></div>
          <div class="boot-splash-wave"></div>
        </div>
        <div class="boot-splash-content">
          <div class="boot-splash-logo-wrap">
            <img
              class="boot-splash-logo"
              src="/brand/logo-192.png"
              alt="Career Pilot"
              width="64"
              height="64"
            />
            <span class="boot-splash-sweep"></span>
          </div>
          <p class="boot-splash-name">Career <span>Pilot</span></p>
          <p class="boot-splash-tagline">Navigate Your Career. Prepare With Confidence.</p>
          <p class="boot-splash-support">
            Your AI-powered companion for interviews, career preparation, and Government Exams.
          </p>
          <div class="boot-splash-bar" aria-hidden="true"><span></span></div>
          <p class="boot-splash-status">Preparing your workspace…</p>
        </div>
      </div>
    </div>
    <style>
      .boot-splash {
        box-sizing: border-box;
        position: relative;
        isolation: isolate;
        overflow-x: hidden;
        min-height: 100vh;
        min-height: 100dvh;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding:
          max(24px, env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
        background: hsl(216, 33%, 97%);
        color: hsl(221, 49%, 8%);
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      }
      html.dark .boot-splash {
        background: hsl(221, 49%, 8%);
        color: hsl(210, 40%, 96%);
      }
      .boot-splash-ambient {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .boot-splash-glow {
        position: absolute;
        left: 50%;
        top: 38%;
        width: min(72vw, 28rem);
        height: min(72vw, 28rem);
        transform: translate(-50%, -50%);
        border-radius: 9999px;
        background: radial-gradient(circle, rgba(37, 99, 235, 0.22) 0%, transparent 68%);
        animation: boot-splash-glow-in 600ms cubic-bezier(0, 0, 0.2, 1) both;
      }
      html.dark .boot-splash-glow {
        background: radial-gradient(circle, rgba(56, 189, 248, 0.18) 0%, transparent 68%);
      }
      .boot-splash-grid {
        position: absolute;
        inset: 0;
        opacity: 0.28;
        background-image:
          linear-gradient(rgba(37, 99, 235, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(37, 99, 235, 0.08) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse at 50% 42%, black 20%, transparent 72%);
        animation: boot-splash-grid-drift 18s linear infinite;
      }
      html.dark .boot-splash-grid {
        opacity: 0.2;
      }
      .boot-splash-wave {
        position: absolute;
        left: 50%;
        bottom: 18%;
        width: min(90vw, 36rem);
        height: 48px;
        transform: translateX(-50%);
        opacity: 0.45;
        background:
          radial-gradient(ellipse at 20% 50%, rgba(56, 189, 248, 0.35) 0 2px, transparent 3px),
          radial-gradient(ellipse at 50% 50%, rgba(37, 99, 235, 0.28) 0 2px, transparent 3px),
          radial-gradient(ellipse at 80% 50%, rgba(56, 189, 248, 0.35) 0 2px, transparent 3px);
        background-size: 100% 100%;
        animation: boot-splash-wave 4.5s ease-in-out infinite;
      }
      .boot-splash-content {
        position: relative;
        z-index: 1;
        width: min(100%, 28rem);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .boot-splash-logo-wrap {
        position: relative;
        width: 4rem;
        height: 4rem;
        margin-bottom: 1.1rem;
        overflow: hidden;
        border-radius: 0.9rem;
        animation: boot-splash-logo-in 500ms cubic-bezier(0, 0, 0.2, 1) 120ms both;
      }
      .boot-splash-logo {
        display: block;
        width: 4rem;
        height: 4rem;
        object-fit: cover;
        border-radius: 0.9rem;
      }
      .boot-splash-sweep {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, 0.45) 50%, transparent 65%);
        transform: translateX(-120%);
        animation: boot-splash-sweep 900ms cubic-bezier(0.4, 0, 0.2, 1) 520ms 1 both;
      }
      .boot-splash-name {
        margin: 0;
        font-size: clamp(1.35rem, 4vw, 1.75rem);
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.2;
        animation: boot-splash-rise 420ms cubic-bezier(0, 0, 0.2, 1) 380ms both;
      }
      .boot-splash-name span {
        color: #2563EB;
      }
      html.dark .boot-splash-name span {
        color: #38BDF8;
      }
      .boot-splash-tagline {
        margin: 0.55rem 0 0;
        max-width: 22rem;
        font-size: clamp(0.92rem, 2.6vw, 1.05rem);
        font-weight: 600;
        line-height: 1.4;
        animation: boot-splash-rise 420ms cubic-bezier(0, 0, 0.2, 1) 520ms both;
      }
      .boot-splash-support {
        margin: 0.45rem 0 0;
        max-width: 24rem;
        font-size: clamp(0.78rem, 2.2vw, 0.875rem);
        line-height: 1.5;
        opacity: 0.72;
        animation: boot-splash-rise 420ms cubic-bezier(0, 0, 0.2, 1) 640ms both;
      }
      .boot-splash-bar {
        width: min(12rem, 70%);
        height: 3px;
        margin-top: 1.35rem;
        overflow: hidden;
        border-radius: 9999px;
        background: rgba(37, 99, 235, 0.16);
        animation: boot-splash-rise 300ms cubic-bezier(0, 0, 0.2, 1) 760ms both;
      }
      html.dark .boot-splash-bar {
        background: rgba(56, 189, 248, 0.18);
      }
      .boot-splash-bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: #2563EB;
        animation: boot-splash-bar 1.4s ease-in-out infinite;
      }
      html.dark .boot-splash-bar span {
        background: #38BDF8;
      }
      .boot-splash-status {
        box-sizing: border-box;
        min-height: 2.6rem;
        margin: 0.85rem 0 0;
        width: 100%;
        font-size: 0.8125rem;
        font-weight: 600;
        line-height: 1.45;
        opacity: 0.78;
        animation: boot-splash-rise 300ms cubic-bezier(0, 0, 0.2, 1) 840ms both;
      }
      @keyframes boot-splash-glow-in {
        from { opacity: 0; transform: translate(-50%, -50%) scale(0.92); }
        to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      }
      @keyframes boot-splash-logo-in {
        from { opacity: 0; transform: scale(0.92); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes boot-splash-rise {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes boot-splash-sweep {
        from { transform: translateX(-120%); }
        to { transform: translateX(120%); }
      }
      @keyframes boot-splash-bar {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(280%); }
      }
      @keyframes boot-splash-grid-drift {
        from { background-position: 0 0; }
        to { background-position: 48px 48px; }
      }
      @keyframes boot-splash-wave {
        0%, 100% { opacity: 0.28; transform: translateX(-50%) scaleX(1); }
        50% { opacity: 0.5; transform: translateX(-50%) scaleX(1.04); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash-glow,
        .boot-splash-logo-wrap,
        .boot-splash-name,
        .boot-splash-tagline,
        .boot-splash-support,
        .boot-splash-bar,
        .boot-splash-status {
          animation: boot-splash-fade 200ms ease both;
        }
        .boot-splash-grid,
        .boot-splash-wave,
        .boot-splash-sweep,
        .boot-splash-bar span {
          animation: none;
        }
        .boot-splash-sweep {
          display: none;
        }
        @keyframes boot-splash-fade {
          from { opacity: 0; }
          to { opacity: 1; }
        }
      }
      @media (max-width: 360px) {
        .boot-splash-logo-wrap,
        .boot-splash-logo {
          width: 3.25rem;
          height: 3.25rem;
        }
      }
      @media (orientation: landscape) and (max-height: 500px) {
        .boot-splash {
          justify-content: flex-start;
          padding-top: max(16px, env(safe-area-inset-top));
        }
        .boot-splash-wave {
          display: none;
        }
      }
    </style>

    <!-- Boot watchdog: if React never mounts, surface the real error + retry -->
    <script src="/boot-watchdog.js"></script>


    <!--
      Overlay portal root:
      Intentionally outside #root so overlay UI is not clipped by React root stacking context.

      SECURITY NOTE:
      Keep this element inert by default with pointer-events:none.
      Only trusted overlay components should enable pointer-events:auto on child panels.
    -->
    <div
      id="overlay-root"
      style="position:fixed;inset:0;pointer-events:none;z-index:1100;isolation:isolate;"
    ></div>

    <!--
      Practice overlay portal root (OverlayWindow mounts here).
      Kept separate from #overlay-root for layout isolation.

      SECURITY NOTE:
      Do not inject unsanitized user-generated HTML into this root.
      All dynamic content rendered into this portal must be React-escaped or DOMPurify-sanitized.
    -->
    <div
      id="clarify-overlay-root"
      style="position:fixed;inset:0;pointer-events:none;z-index:1100;isolation:isolate;"
    ></div>


  </body>
</html>
