    <meta name="twitter:title" content="Clarify AI — AI-Powered Interview Preparation">
    <meta property="og:description" content="Real-time AI coaching for live interviews, mock sessions with deep analytics, and a full prep lab.">
    <meta name="twitter:description" content="Real-time AI coaching for live interviews, mock sessions with deep analytics, and a full prep lab.">
    <meta property="og:url" content="https://clarify.ai.sltfinanceindia.com/" />
    <meta property="og:site_name" content="Clarify AI" />

    <meta name="twitter:image" content="https://pub-bb2e103a32db4e198524a2e9ed8f35b4.r2.dev/cf9497ed-156a-43a7-a036-25f470f60edd/id-preview-3e0efc6d--ff2f1c32-d4fd-4bbf-914d-d72bd2dd40a7.lovable.app-1774022724389.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta property="og:type" content="website">

    <!-- Brand JSON-LD: WebSite + Organization for rich search results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "Clarify AI",
            "url": "https://clarify.ai.sltfinanceindia.com/",
            "logo": "https://clarify.ai.sltfinanceindia.com/images/clarify-logo.png",
            "sameAs": [
              "https://twitter.com/clarifyai",
              "https://github.com/clarifyai"
            ]
          },
          {
            "@type": "WebSite",
            "name": "Clarify AI",
            "url": "https://clarify.ai.sltfinanceindia.com/",
            "description": "AI-powered interview preparation with real-time coaching, mock sessions, and a stealth overlay."
          }
        ]
      }
    </script>
  </head>
  <body>
    <!--
      Pre-hydration theme script: ensures light mode on first load.
      New users get light; returning users get their saved preference.
      Runs synchronously before React renders to prevent flash-of-wrong-theme.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("confideq-ui");
          var isDark = false;
          if (stored) {
            var state    = JSON.parse(stored);
            var resolved = state.state && state.state.resolved_theme;
            var theme    = state.state && state.state.theme;
            isDark = (theme === "dark") || (theme === "system" && resolved === "dark");
          }
          document.documentElement.classList.toggle("dark", isDark);
        } catch (e) {
          // On any parse error, default to light mode
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>

    <!-- React app root -->
    <div id="root"></div>

    <!--
      Overlay portal root — intentionally OUTSIDE #root so the overlay sits
      on a separate compositor layer and is never clipped by #root's stacking
      context. Styled inline so it works even before the CSS bundle loads.

      pointer-events:none at this level so the element itself never intercepts
      clicks; individual overlay panels set pointer-events:auto on their own
      wrapper nodes.
    -->
    <div
      id="overlay-root"
      style="position:fixed;inset:0;pointer-events:none;z-index:2147483647;isolation:isolate;"
    ></div>

    <!--
      Stealth overlay portal root. The OverlayWindow component portals its
      panel into this node. Kept separate from #overlay-root so panic-kill
      and screen-capture-blocker can target it by id without affecting other
      portals (toasts, command palette, etc.).
    -->
    <div
      id="clarify-overlay-root"
      style="position:fixed;inset:0;pointer-events:none;z-index:2147483647;isolation:isolate;"
    ></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
