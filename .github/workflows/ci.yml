name: CI

on:
  push:
    branches: [main]
  pull_request:

# Placeholder VITE_* values for compile-time env resolution — not real secrets.
env:
  VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
  VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key-not-a-real-secret
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
  VITE_APP_ENV: development
  VITE_APP_NAME: Career Pilot
  VITE_APP_URL: http://127.0.0.1:5173

jobs:
  quality:
    name: Validate, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate environment
        run: npm run validate-env

      - name: Unit tests
        run: npm test -- --run

      - name: Release copy gates
        run: npm run release:gates

      - name: Secret scan
        run: npm run scan:secrets

      - name: Release security gates
        run: npm run release:security-gates

      - name: Billing catalog parity
        run: npm run billing:parity

      - name: AI credit catalog parity
        run: npm run billing:parity-ai

      - name: AI capability gates
        run: npm run release:capability-gates

      - name: Edge function parity
        run: npm run release:edge-parity

      - name: Billing config preflight
        run: npm run billing:preflight

      # Non-blocking: surfaces high-severity advisories without failing the build.
      - name: Dependency audit
        run: npm audit --production --audit-level=high
        continue-on-error: true

      - name: Build
        run: npm run build

      # CI uses placeholder VITE_SUPABASE_URL (see env: block above), so this
      # confirms the bake-in mechanism itself works, not the real project ref.
      # Real deploys (Lovable) must run `npm run verify:dist-env` with the
      # actual VITE_SUPABASE_URL so a missing/blank dashboard env var fails
      # the deploy instead of shipping a broken bundle (see BUG-LIVE-STAGING-ENV).
      - name: Verify dist bundle has env baked in
        run: npm run verify:dist-env

  e2e:
    name: Playwright E2E (smoke)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
