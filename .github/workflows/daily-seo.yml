# Daily sitemap refresh + crawler ping (Google, Bing).
# Does not guarantee search rankings. Requires public sitemap at trycareerpilot.com.
name: Daily SEO

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate sitemap
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/generate-sitemap.mjs

      - name: Commit sitemap if URLs changed
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sitemap.xml
          if git diff --cached --quiet; then
            echo "Sitemap unchanged"
          else
            git commit -m "chore(seo): refresh public sitemap"
            git push
          fi

      - name: Ping Google and Bing
        run: node scripts/generate-sitemap.mjs --ping
